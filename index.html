<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            instaBg: '#fafafa',
            instaDarkBg: '#121212',
            instaCardDark: '#1e1e1e',
            instaBorder: '#dbdbdb',
            instaDarkBorder: '#2f2f2f',
            instaBlue: '#0095f6',
          }
        }
      }
    }
  </script>
  <style>
    .badge-icon { color: #0095f6; margin-left: 2px; display: inline-block; vertical-align: middle; }
    .story-ring { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #444; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-instaBg dark:bg-instaDarkBg text-gray-900 dark:text-gray-100 h-full font-sans transition-colors duration-200">

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white dark:bg-white dark:text-gray-900 px-4 py-2 rounded-full text-sm shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none"></div>

  <!-- Hidden File Input for Profile Picture -->
  <input type="file" id="profilePicInput" accept="image/*" class="hidden" onchange="handleProfilePicUpload(event)">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white dark:bg-black border-b border-instaBorder dark:border-instaDarkBorder px-4 py-3 flex justify-between items-center max-w-lg mx-auto">
    <h1 class="text-2xl font-bold italic tracking-tight bg-gradient-to-r from-orange-500 via-pink-500 to-purple-600 bg-clip-text text-transparent cursor-pointer" onclick="switchTab('feed')">Picora</h1>
    
    <div id="headerNav" class="flex items-center space-x-3 hidden">
      <button onclick="toggleDarkMode()" class="text-xl p-1" title="다크모드 토글">🌙</button>
      <button onclick="switchTab('explore')" class="text-xl p-1" title="탐색/릴스">🔍</button>
      <button onclick="switchTab('dm')" class="text-xl p-1 relative" title="메시지">
        💬 <span id="dmBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">●</span>
      </button>
      <button onclick="switchTab('profile')" class="text-xl p-1" title="프로필">👤</button>
      <button onclick="logout()" class="text-xs bg-gray-200 dark:bg-gray-800 px-2 py-1 rounded font-semibold">로그아웃</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-lg mx-auto pb-20">

    <!-- Auth View -->
    <div id="authView" class="p-6 mt-6 max-w-sm mx-auto bg-white dark:bg-instaCardDark border border-instaBorder dark:border-instaDarkBorder rounded-lg shadow-sm text-center">
      <h2 class="text-3xl font-bold italic mb-6 bg-gradient-to-r from-orange-500 via-pink-500 to-purple-600 bg-clip-text text-transparent">Picora</h2>
      
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3">
        <input type="text" id="authId" placeholder="아이디" required class="w-full px-3 py-2 text-xs border border-instaBorder dark:border-instaDarkBorder rounded bg-gray-50 dark:bg-gray-800 focus:outline-none">
        <input type="text" id="authName" placeholder="닉네임 (회원가입 시)" class="signup-only hidden w-full px-3 py-2 text-xs border border-instaBorder dark:border-instaDarkBorder rounded bg-gray-50 dark:bg-gray-800 focus:outline-none">
        <input type="password" id="authPw" placeholder="비밀번호" class="pw-only w-full px-3 py-2 text-xs border border-instaBorder dark:border-instaDarkBorder rounded bg-gray-50 dark:bg-gray-800 focus:outline-none">
        
        <button type="submit" id="authBtn" class="w-full bg-instaBlue text-white py-2 rounded font-semibold text-sm hover:bg-blue-600 transition">로그인</button>
      </form>

      <div class="mt-4 text-xs text-instaBlue cursor-pointer" id="authToggle" onclick="toggleAuthMode()">
        계정이 없으신가요? 회원가입
      </div>

      <div class="mt-6 border-t border-gray-200 dark:border-gray-700 pt-4">
        <button onclick="enterDemoMode()" class="w-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 py-2 rounded text-xs font-semibold hover:bg-gray-200 dark:hover:bg-gray-700 transition">
          🚀 로그인 없이 둘러보기 (맛보기 모드)
        </button>
      </div>
    </div>

    <!-- App Views Container -->
    <div id="appView" class="hidden">

      <!-- Admin Panel -->
      <div id="adminPanel" class="hidden m-4 p-4 border border-instaBlue rounded-lg bg-blue-50 dark:bg-blue-950/30 text-xs space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-instaBlue text-sm">🛡️ 관리자 대시보드 (클라우드 데이터 관리)</h3>
          <span class="text-gray-500">전체 가입자: <strong id="adminUserCount" class="text-black dark:text-white">0</strong>명</span>
        </div>
        <div class="flex gap-2 border-b border-blue-200 dark:border-blue-800 pb-2">
          <button onclick="switchAdminTab('users')" class="px-2 py-1 bg-instaBlue text-white rounded font-bold">계정 관리</button>
          <button onclick="switchAdminTab('posts')" class="px-2 py-1 bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded">게시물 관리</button>
        </div>
        <div id="adminContent" class="max-h-48 overflow-y-auto space-y-2 custom-scrollbar"></div>
      </div>

      <!-- Feed Tab -->
      <div id="tabFeed" class="tab-content">
        <!-- Stories -->
        <div class="bg-white dark:bg-black border-b border-instaBorder dark:border-instaDarkBorder p-3 flex space-x-4 overflow-x-auto custom-scrollbar">
          <div class="flex flex-col items-center space-y-1 cursor-pointer min-w-[60px]" onclick="triggerStoryUpload()">
            <div class="w-14 h-14 rounded-full border-2 border-gray-300 dark:border-gray-700 flex items-center justify-center text-xl bg-gray-100 dark:bg-gray-800 overflow-hidden">
              <img id="myStoryAvatar" src="https://via.placeholder.com/150" class="w-full h-full object-cover hidden">
              <span id="myStoryPlus">+</span>
            </div>
            <span class="text-[11px] truncate w-14 text-center">내 스토리</span>
            <input type="file" id="storyFileInput" accept="image/*,video/*" class="hidden" onchange="uploadStory(event)">
          </div>
          <div id="storiesContainer" class="flex space-x-4"></div>
        </div>

        <!-- Create Post -->
        <div class="bg-white dark:bg-instaCardDark border-b border-instaBorder dark:border-instaDarkBorder p-4 mb-4">
          <textarea id="postCaption" placeholder="문구 입력..." class="w-full text-xs p-2 border border-instaBorder dark:border-instaDarkBorder rounded bg-gray-50 dark:bg-gray-800 resize-none h-16 focus:outline-none mb-2"></textarea>
          
          <!-- Filter Selection -->
          <div id="filterSelection" class="hidden mb-2">
            <label class="text-[11px] text-gray-500 block mb-1">사진 필터 적용:</label>
            <div class="flex gap-2 overflow-x-auto text-xs">
              <button onclick="setPostFilter('none')" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded">원본</button>
              <button onclick="setPostFilter('grayscale(100%)')" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded">흑백</button>
              <button onclick="setPostFilter('sepia(100%)')" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded">세피아</button>
              <button onclick="setPostFilter('contrast(150%)')" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded">선명하게</button>
            </div>
          </div>

          <div class="flex justify-between items-center">
            <input type="file" id="postFileInput" accept="image/*,video/*" class="text-xs" onchange="handleFileSelect(event)">
            <button onclick="createPost()" class="bg-instaBlue text-white text-xs px-4 py-1.5 rounded font-semibold">게시</button>
          </div>
        </div>

        <!-- Feed Posts List -->
        <div id="feedList" class="space-y-4"></div>
      </div>

      <!-- Explore Tab -->
      <div id="tabExplore" class="tab-content hidden p-2">
        <h3 class="font-bold text-sm mb-3">🔥 추천 릴스 및 게시물</h3>
        <div id="exploreGrid" class="grid grid-cols-3 gap-1"></div>
      </div>

      <!-- DM Tab -->
      <div id="tabDm" class="tab-content hidden bg-white dark:bg-instaCardDark border border-instaBorder dark:border-instaDarkBorder rounded-lg m-2 h-[500px] flex flex-col">
        <div class="p-3 border-b border-instaBorder dark:border-instaDarkBorder font-bold text-sm">다이렉트 메시지 (DM)</div>
        <div id="dmMessages" class="flex-1 p-3 overflow-y-auto space-y-2 custom-scrollbar text-xs"></div>
        <div class="p-2 border-t border-instaBorder dark:border-instaDarkBorder flex gap-2">
          <input type="text" id="dmInput" placeholder="메시지 입력..." class="flex-1 text-xs p-2 border border-instaBorder dark:border-instaDarkBorder rounded bg-gray-50 dark:bg-gray-800 focus:outline-none">
          <button onclick="sendDM()" class="bg-instaBlue text-white text-xs px-3 py-1 rounded font-bold">전송</button>
        </div>
      </div>

      <!-- Profile Tab -->
      <div id="tabProfile" class="tab-content hidden p-4 bg-white dark:bg-instaCardDark border border-instaBorder dark:border-instaDarkBorder rounded-lg m-2">
        <div class="flex items-center space-x-4 mb-4">
          <div class="relative w-16 h-16 rounded-full overflow-hidden border border-gray-300 dark:border-gray-700 cursor-pointer group" onclick="triggerProfilePicUpload()">
            <img id="profileAvatar" src="https://via.placeholder.com/150" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-[10px] opacity-0 group-hover:opacity-100 transition">변경</div>
          </div>
          <div>
            <div class="flex items-center space-x-1">
              <span id="profileName" class="font-bold text-base"></span>
              <span id="profileBadge" class="hidden badge-icon">✔</span>
            </div>
            <div class="text-xs text-gray-500">팔로워 <strong id="profileFollowers" class="text-black dark:text-white">0</strong>명</div>
            <div class="mt-1 space-x-1">
              <button id="badgeApplyBtn" onclick="applyBadge()" class="hidden text-[11px] bg-instaBlue text-white px-2 py-0.5 rounded font-semibold">체크마크 신청</button>
              <button id="adminFollowerBtn" onclick="addAdminFollowers()" class="hidden text-[11px] bg-purple-600 text-white px-2 py-0.5 rounded font-semibold">[관리자 전용] 팔로워 +500</button>
            </div>
          </div>
        </div>

        <!-- Editable Bio Section -->
        <div class="mb-4 border-t border-b border-gray-100 dark:border-gray-800 py-3">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-gray-500">소개 (Bio)</span>
            <button onclick="toggleBioEdit()" class="text-[11px] text-instaBlue">수정</button>
          </div>
          <p id="bioDisplay" class="text-xs text-gray-700 dark:text-gray-300 whitespace-pre-wrap">소개가 없습니다.</p>
          <div id="bioEditBox" class="hidden mt-2">
            <textarea id="bioInput" class="w-full text-xs p-2 border border-instaBorder dark:border-instaDarkBorder rounded bg-gray-50 dark:bg-gray-800 focus:outline-none resize-none h-16"></textarea>
            <button onclick="saveBio()" class="mt-1 bg-instaBlue text-white text-[11px] px-3 py-1 rounded font-bold">저장</button>
          </div>
        </div>

        <h4 class="font-bold text-xs mb-2">내가 올린 게시물</h4>
        <div id="profileGrid" class="grid grid-cols-3 gap-1"></div>
      </div>

    </div>

  </main>

  <script>
    // System Constants
    const ADMIN_ID = "instagramnice!!@456";

    // App State
    let users = [];
    let posts = [];
    let stories = [];
    let dmMessages = [];
    let currentUser = null;
    let isSignUpMode = false;
    let selectedFilter = 'none';

    // Global Initializer
    window.onload = () => {
      // Load saved state
      const savedUser = localStorage.getItem('picora_current_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showApp();
      } else {
        showAuth();
      }
      loadMockData();
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2500);
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    // Navigation & Tabs
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      if (tab === 'feed') document.getElementById('tabFeed').classList.remove('hidden');
      if (tab === 'explore') {
        document.getElementById('tabExplore').classList.remove('hidden');
        renderExplore();
      }
      if (tab === 'dm') {
        document.getElementById('tabDm').classList.remove('hidden');
        renderDM();
      }
      if (tab === 'profile') {
        document.getElementById('tabProfile').classList.remove('hidden');
        renderProfile();
      }
    }

    // Auth Actions
    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('authBtn').textContent = isSignUpMode ? "회원가입" : "로그인";
      document.getElementById('authToggle').textContent = isSignUpMode ? "계정이 있으신가요? 로그인" : "계정이 없으신가요? 회원가입";
      
      document.querySelectorAll('.signup-only').forEach(el => el.classList.toggle('hidden', !isSignUpMode));
      document.querySelectorAll('.pw-only').forEach(el => el.classList.toggle('hidden', isSignUpMode && false));
    }

    function handleAuth(e) {
      e.preventDefault();
      const id = document.getElementById('authId').value.trim();
      const pw = document.getElementById('authPw').value.trim();
      const name = document.getElementById('authName').value.trim();

      if (id === ADMIN_ID) {
        currentUser = { id: ADMIN_ID, name: "관리자", followers: 9999, hasBadge: true, isAdmin: true, bio: "Picora 공식 관리자 계정입니다.", avatar: "https://via.placeholder.com/150/0095f6/ffffff?text=ADMIN" };
        saveCurrentUser();
        showApp();
        showToast("관리자로 로그인되었습니다.");
        return;
      }

      if (isSignUpMode) {
        if (!name) return alert("닉네임을 입력하세요.");
        if (users.some(u => u.name === name)) return alert("이미 사용 중인 닉네임입니다.");
        if (users.some(u => u.id === id)) return alert("이미 존재하는 아이디입니다.");

        const newUser = { id, pw, name, followers: 0, hasBadge: false, isAdmin: false, bio: "", avatar: "https://via.placeholder.com/150" };
        users.push(newUser);
        currentUser = newUser;
        saveUsers();
        saveCurrentUser();
        showApp();
      } else {
        const user = users.find(u => u.id === id && u.pw === pw);
        if (!user) return alert("아이디 또는 비밀번호가 잘못되었습니다.");
        currentUser = user;
        saveCurrentUser();
        showApp();
      }
    }

    function enterDemoMode() {
      currentUser = { id: "demo_guest", name: "게스트", followers: 150, hasBadge: false, isAdmin: false, bio: "맛보기 게스트 계정입니다.", avatar: "https://via.placeholder.com/150" };
      showApp();
      showToast("맛보기 모드로 접속했습니다.");
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('picora_current_user');
      showAuth();
    }

    function showAuth() {
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('appView').classList.add('hidden');
      document.getElementById('headerNav').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      document.getElementById('headerNav').classList.remove('hidden');

      if (currentUser.isAdmin) {
        document.getElementById('adminPanel').classList.remove('hidden');
        renderAdmin();
      } else {
        document.getElementById('adminPanel').classList.add('hidden');
      }

      updateStoryAvatar();
      renderFeed();
      switchTab('feed');
    }

    // Profile & Bio Functions
    function renderProfile() {
      document.getElementById('profileName').textContent = currentUser.name;
      document.getElementById('profileAvatar').src = currentUser.avatar || "https://via.placeholder.com/150";
      document.getElementById('profileFollowers').textContent = currentUser.followers;
      document.getElementById('bioDisplay').textContent = currentUser.bio || "소개가 없습니다.";
      document.getElementById('bioInput').value = currentUser.bio || "";
      
      const badgeEl = document.getElementById('profileBadge');
      if (currentUser.hasBadge) badgeEl.classList.remove('hidden');
      else badgeEl.classList.add('hidden');

      const applyBtn = document.getElementById('badgeApplyBtn');
      if (!currentUser.hasBadge && (currentUser.followers >= 1000 || currentUser.isAdmin)) {
        applyBtn.classList.remove('hidden');
      } else {
        applyBtn.classList.add('hidden');
      }

      const adminBtn = document.getElementById('adminFollowerBtn');
      if (currentUser.isAdmin) adminBtn.classList.remove('hidden');
      else adminBtn.classList.add('hidden');

      // Profile grid media
      const profileGrid = document.getElementById('profileGrid');
      profileGrid.innerHTML = '';
      const myPosts = posts.filter(p => p.author === currentUser.name);
      myPosts.forEach(p => {
        const div = document.createElement('div');
        div.className = "aspect-square bg-gray-100 dark:bg-gray-800 overflow-hidden";
        if (p.mediaSrc) {
          if (p.mediaType === 'video') {
            div.innerHTML = `<video src="${p.mediaSrc}" class="w-full h-full object-cover"></video>`;
          } else {
            div.innerHTML = `<img src="${p.mediaSrc}" class="w-full h-full object-cover" style="filter: ${p.filter || 'none'}">`;
          }
        } else {
          div.className = "aspect-square bg-gray-200 dark:bg-gray-800 p-2 text-[10px] overflow-hidden flex items-center justify-center text-center";
          div.textContent = p.caption;
        }
        profileGrid.appendChild(div);
      });
    }

    function triggerProfilePicUpload() {
      document.getElementById('profilePicInput').click();
    }

    function handleProfilePicUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        currentUser.avatar = evt.target.result;
        saveCurrentUser();
        updateUserInList(currentUser);
        renderProfile();
        updateStoryAvatar();
        showToast("프로필 사진이 변경되었습니다.");
      };
      reader.readAsDataURL(file);
    }

    function toggleBioEdit() {
      document.getElementById('bioEditBox').classList.toggle('hidden');
    }

    function saveBio() {
      const newBio = document.getElementById('bioInput').value.trim();
      currentUser.bio = newBio;
      saveCurrentUser();
      updateUserInList(currentUser);
      document.getElementById('bioEditBox').classList.add('hidden');
      renderProfile();
      showToast("프로필 소개가 저장되었습니다.");
    }

    function applyBadge() {
      currentUser.hasBadge = true;
      saveCurrentUser();
      updateUserInList(currentUser);
      renderProfile();
      renderFeed();
      showToast("체크마크(인증 마크)가 발급되었습니다!");
    }

    function addAdminFollowers() {
      if (!currentUser.isAdmin) return;
      currentUser.followers += 500;
      saveCurrentUser();
      renderProfile();
      showToast("팔로워 +500 증가했습니다.");
    }

    // Post Creation & Feed
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image')) {
        document.getElementById('filterSelection').classList.remove('hidden');
      } else {
        document.getElementById('filterSelection').classList.add('hidden');
      }
    }

    function setPostFilter(filterStr) {
      selectedFilter = filterStr;
      showToast("필터가 선택되었습니다.");
    }

    function createPost() {
      const caption = document.getElementById('postCaption').value.trim();
      const fileInput = document.getElementById('postFileInput');
      const file = fileInput.files[0];

      if (!caption && !file) return alert("내용 또는 파일 파일을 등록하세요.");

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const type = file.type.startsWith('video') ? 'video' : 'image';
          savePost(caption, e.target.result, type);
        };
        reader.readAsDataURL(file);
      } else {
        savePost(caption, null, null);
      }
    }

    function savePost(caption, mediaSrc, mediaType) {
      const newPost = {
        id: Date.now(),
        author: currentUser.name,
        avatar: currentUser.avatar || "https://via.placeholder.com/150",
        hasBadge: currentUser.hasBadge,
        caption,
        mediaSrc,
        mediaType,
        filter: selectedFilter,
        likes: 0,
        likedBy: [],
        comments: []
      };

      posts.unshift(newPost);
      savePosts();
      document.getElementById('postCaption').value = '';
      document.getElementById('postFileInput').value = '';
      document.getElementById('filterSelection').classList.add('hidden');
      selectedFilter = 'none';
      renderFeed();
      showToast("게시물이 등록되었습니다.");
    }

    function renderFeed() {
      const feedList = document.getElementById('feedList');
      feedList.innerHTML = '';

      posts.forEach(post => {
        const el = document.createElement('div');
        el.className = "bg-white dark:bg-instaCardDark border-b border-instaBorder dark:border-instaDarkBorder pb-3";

        const badgeHTML = post.hasBadge ? '<span class="badge-icon">✔</span>' : '';
        let mediaHTML = '';

        // Flexible support for both landscape & portrait orientation
        if (post.mediaSrc) {
          if (post.mediaType === 'video') {
            mediaHTML = `<div class="w-full bg-black flex justify-center max-h-[520px]">
              <video src="${post.mediaSrc}" controls class="w-full max-h-[520px] object-contain"></video>
            </div>`;
          } else {
            mediaHTML = `<div class="w-full bg-black flex justify-center max-h-[520px]">
              <img src="${post.mediaSrc}" class="w-full max-h-[520px] object-contain" style="filter: ${post.filter || 'none'}">
            </div>`;
          }
        }

        const commentsHTML = post.comments.map(c => `
          <div class="text-xs">
            <strong>${c.author}</strong> ${c.text}
          </div>
        `).join('');

        const isLiked = post.likedBy && post.likedBy.includes(currentUser.name);

        el.innerHTML = `
          <div class="flex items-center space-x-2 p-3">
            <img src="${post.avatar || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover">
            <span class="font-bold text-xs">${post.author}</span>${badgeHTML}
          </div>
          ${mediaHTML}
          <div class="p-3">
            <div class="flex items-center space-x-3 text-lg mb-1">
              <button onclick="toggleLike(${post.id})">${isLiked ? '❤️' : '🤍'}</button>
              <button onclick="focusComment(${post.id})">💬</button>
            </div>
            <div class="text-xs font-bold mb-1">좋아요 <span id="likeCount-${post.id}">${post.likes || 0}</span>개</div>
            <div class="text-xs mb-2"><strong>${post.author}</strong> ${post.caption}</div>
            <div class="space-y-1 mb-2 max-h-24 overflow-y-auto custom-scrollbar" id="comments-${post.id}">${commentsHTML}</div>
            <div class="flex gap-2 border-t border-gray-100 dark:border-gray-800 pt-2">
              <input type="text" id="commentInput-${post.id}" placeholder="댓글 달기..." class="flex-1 text-xs bg-transparent focus:outline-none">
              <button onclick="addComment(${post.id})" class="text-xs text-instaBlue font-bold">게시</button>
            </div>
          </div>
        `;
        feedList.appendChild(el);
      });
    }

    function toggleLike(postId) {
      const post = posts.find(p => p.id === postId);
      if (!post) return;
      if (!post.likedBy) post.likedBy = [];

      const idx = post.likedBy.indexOf(currentUser.name);
      if (idx === -1) {
        post.likedBy.push(currentUser.name);
        post.likes = (post.likes || 0) + 1;
      } else {
        post.likedBy.splice(idx, 1);
        post.likes = Math.max(0, (post.likes || 1) - 1);
      }
      savePosts();
      renderFeed();
    }

    function addComment(postId) {
      const input = document.getElementById(`commentInput-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({ author: currentUser.name, text });
        savePosts();
        input.value = '';
        renderFeed();
      }
    }

    function focusComment(postId) {
      document.getElementById(`commentInput-${postId}`).focus();
    }

    // Stories System
    function updateStoryAvatar() {
      const avatarImg = document.getElementById('myStoryAvatar');
      const plusSpan = document.getElementById('myStoryPlus');
      if (currentUser && currentUser.avatar) {
        avatarImg.src = currentUser.avatar;
        avatarImg.classList.remove('hidden');
        plusSpan.classList.add('hidden');
      }
    }

    function triggerStoryUpload() {
      document.getElementById('storyFileInput').click();
    }

    function uploadStory(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        stories.unshift({
          id: Date.now(),
          author: currentUser.name,
          avatar: currentUser.avatar || "https://via.placeholder.com/150",
          mediaSrc: evt.target.result
        });
        saveStories();
        renderStories();
        showToast("스토리가 등록되었습니다.");
      };
      reader.readAsDataURL(file);
    }

    function renderStories() {
      const container = document.getElementById('storiesContainer');
      container.innerHTML = '';
      stories.forEach(s => {
        const div = document.createElement('div');
        div.className = "flex flex-col items-center space-y-1 cursor-pointer min-w-[60px]";
        div.onclick = () => alert(`${s.author}님의 스토리 보기`);
        div.innerHTML = `
          <div class="w-14 h-14 rounded-full p-[2px] story-ring">
            <img src="${s.avatar}" class="w-full h-full object-cover rounded-full border-2 border-white dark:border-black">
          </div>
          <span class="text-[11px] truncate w-14 text-center">${s.author}</span>
        `;
        container.appendChild(div);
      });
    }

    // Explore Grid (Landscape & Portrait video layout)
    function renderExplore() {
      const grid = document.getElementById('exploreGrid');
      grid.innerHTML = '';
      posts.forEach(p => {
        const div = document.createElement('div');
        div.className = "aspect-square bg-gray-200 dark:bg-gray-800 overflow-hidden relative";
        if (p.mediaSrc) {
          if (p.mediaType === 'video') {
            div.innerHTML = `<video src="${p.mediaSrc}" class="w-full h-full object-cover"></video><span class="absolute top-1 right-1 text-xs">🎥</span>`;
          } else {
            div.innerHTML = `<img src="${p.mediaSrc}" class="w-full h-full object-cover">`;
          }
        } else {
          div.className = "aspect-square bg-gray-300 dark:bg-gray-700 p-2 text-[10px] flex items-center justify-center text-center overflow-hidden";
          div.textContent = p.caption;
        }
        grid.appendChild(div);
      });
    }

    // DM System
    function renderDM() {
      const box = document.getElementById('dmMessages');
      box.innerHTML = '';
      dmMessages.forEach(m => {
        const isMe = m.author === currentUser.name;
        const div = document.createElement('div');
        div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
        div.innerHTML = `
          <span class="text-[10px] text-gray-400">${m.author}</span>
          <div class="p-2 rounded-lg max-w-[75%] ${isMe ? 'bg-instaBlue text-white' : 'bg-gray-100 dark:bg-gray-800'}">
            ${m.text}
          </div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function sendDM() {
      const input = document.getElementById('dmInput');
      const text = input.value.trim();
      if (!text) return;

      dmMessages.push({ author: currentUser.name, text });
      saveDMs();
      input.value = '';
      renderDM();
    }

    // Admin Control Panel
    function renderAdmin() {
      document.getElementById('adminUserCount').textContent = users.length;
      switchAdminTab('users');
    }

    function switchAdminTab(type) {
      const content = document.getElementById('adminContent');
      content.innerHTML = '';

      if (type === 'users') {
        users.forEach(u => {
          const div = document.createElement('div');
          div.className = "flex justify-between items-center p-2 bg-white dark:bg-gray-800 rounded text-xs";
          div.innerHTML = `
            <span>${u.name} (팔로워: ${u.followers}) ${u.hasBadge ? '✔' : ''}</span>
            <button onclick="adminDeleteUser('${u.id}')" class="text-red-500 font-bold">삭제</button>
          `;
          content.appendChild(div);
        });
      } else {
        posts.forEach(p => {
          const div = document.createElement('div');
          div.className = "flex justify-between items-center p-2 bg-white dark:bg-gray-800 rounded text-xs";
          div.innerHTML = `
            <span class="truncate w-40">${p.author}: ${p.caption || '미디어'}</span>
            <button onclick="adminDeletePost(${p.id})" class="text-red-500 font-bold">삭제</button>
          `;
          content.appendChild(div);
        });
      }
    }

    function adminDeleteUser(id) {
      users = users.filter(u => u.id !== id);
      saveUsers();
      renderAdmin();
      showToast("계정이 삭제되었습니다.");
    }

    function adminDeletePost(id) {
      posts = posts.filter(p => p.id !== id);
      savePosts();
      renderAdmin();
      renderFeed();
      showToast("게시물이 삭제되었습니다.");
    }

    // LocalStorage Helper Operations
    function saveUsers() { localStorage.setItem('picora_users', JSON.stringify(users)); }
    function savePosts() { localStorage.setItem('picora_posts', JSON.stringify(posts)); }
    function saveStories() { localStorage.setItem('picora_stories', JSON.stringify(stories)); }
    function saveDMs() { localStorage.setItem('picora_dms', JSON.stringify(dmMessages)); }
    function saveCurrentUser() { localStorage.setItem('picora_current_user', JSON.stringify(currentUser)); }

    function updateUserInList(u) {
      const idx = users.findIndex(item => item.id === u.id);
      if (idx !== -1) users[idx] = u;
      saveUsers();
    }

    function loadMockData() {
      users = JSON.parse(localStorage.getItem('picora_users')) || [
        { id: ADMIN_ID, name: "관리자", followers: 9999, hasBadge: true, isAdmin: true, bio: "Picora 공식 계정입니다." }
      ];
      posts = JSON.parse(localStorage.getItem('picora_posts')) || [];
      stories = JSON.parse(localStorage.getItem('picora_stories')) || [];
      dmMessages = JSON.parse(localStorage.getItem('picora_dms')) || [];
      renderStories();
    }
  </script>
</body>
</html>
